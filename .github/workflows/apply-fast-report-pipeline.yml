name: Apply fast report pipeline

on:
  push:
    branches:
      - fix/nims-lab-culture-parsing-0103
    paths:
      - scripts/apply_fast_report_pipeline.py
      - .github/workflows/apply-fast-report-pipeline.yml

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nims-lab-culture-parsing-0103
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply deterministic migration
        run: python scripts/apply_fast_report_pipeline.py
      - name: Validate generated code
        working-directory: mobile/android
        run: ./gradlew clean test lintDebug assembleDebug --console=plain
      - name: Commit validated implementation
        run: |
          rm -f scripts/apply_fast_report_pipeline.py .github/workflows/apply-fast-report-pipeline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement fast deduplicated report pipeline"
          git push origin HEAD:fix/nims-lab-culture-parsing-0103
