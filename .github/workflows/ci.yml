name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  apply-fast-pipeline:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Apply deterministic report-pipeline migration
        run: |
          python scripts/apply_fast_report_pipeline.py
          python scripts/fix_fast_pipeline_generated.py
      - name: Validate generated Android implementation
        working-directory: mobile/android
        run: ./gradlew clean test lintDebug assembleDebug --console=plain
      - name: Print failing unit-test details
        if: failure()
        shell: bash
        run: |
          find mobile/android/app/build/test-results -name '*.xml' -type f -print0 2>/dev/null \
            | xargs -0 grep -H -A12 -B3 '<failure' || true
      - name: Commit validated implementation to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_fast_report_pipeline.py scripts/fix_fast_pipeline_generated.py .github/workflows/apply-fast-report-pipeline.yml
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement fast deduplicated report pipeline"
          git push origin HEAD:${{ github.head_ref }}

  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r helper/requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m py_compile helper/main.py helper/models.py helper/cache.py

  navigation-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run JavaScript tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log
      - name: Upload JavaScript test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-test-log
          path: npm-test.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify canonical navigation core sync
        run: python scripts/sync_navigation_core.py --check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python ../../scripts/sync_navigation_core.py --check
        working-directory: mobile/android
      - name: Build, unit test, lint, and assemble
        run: ./gradlew clean test lintDebug assembleDebug --console=plain
        working-directory: mobile/android
      - name: Verify packaged NIMS runtime
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          listing="$(unzip -l app/build/outputs/apk/debug/app-debug.apk)"
          for required in nimsReportCore.js contentUtils.js nimsAndroidFrameBridge.js nimsWebviewShim.js; do
            echo "$listing" | grep "assets/$required"
          done
          if echo "$listing" | grep -q 'assets/test/'; then
            echo 'Shared JavaScript tests were packaged into the APK'
            exit 1
          fi
          if echo "$listing" | grep -q 'nimsOnDemandExtractor.js'; then
            echo 'Obsolete 0.10.0 runtime asset was packaged'
            exit 1
          fi
      - name: Verify KVM
        run: |
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Run instrumented PDF tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: mobile/android
          script: |
            adb wait-for-device
            ./gradlew connectedDebugAndroidTest --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: nims-results-0.10.2-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-lint-and-instrumentation-reports
          path: |
            mobile/android/app/build/reports/tests/
            mobile/android/app/build/reports/androidTests/
            mobile/android/app/build/outputs/androidTest-results/
            mobile/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f helper/Dockerfile .
