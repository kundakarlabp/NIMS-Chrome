name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enforce results-only repository
        shell: bash
        run: |
          set -euo pipefail
          for removed in mobile shared docs scripts railway.json .dockerignore; do test ! -e "$removed"; done
          test ! -e dashboard/mobileRelay.ts
          test ! -e dashboard/APPDEPLOY_MOBILE_BRIDGE_PATCH.md
          test ! -e helper/cache.py
          test ! -e helper/Dockerfile
          ! find extension/src -maxdepth 1 -type f \( -name 'sidepanel*' -o -name 'manual*' -o -name 'contentScript.js' -o -name 'contentUtils.js' -o -name 'styles.css' \) | grep .
          ! grep -R -E 'CWS_|chromewebstore|NIMS_HELPER_REMOTE_MODE|sidePanel|side_panel' extension/src helper dashboard README.md SECURITY.md AGENTS.md
      - name: Verify minimal manifest
        run: python - <<'PY'
          import json
          m=json.load(open("extension/manifest.json"))
          assert set(m["permissions"])=={"tabs","webNavigation"}
          assert "side_panel" not in m and "action" not in m
          assert not any("railway" in h for h in m["host_permissions"])
          PY
  javascript:
    needs: repository-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
  helper:
    needs: repository-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r helper/requirements-dev.txt
      - run: PYTHONPATH=helper python -m pytest -q
      - run: python -m py_compile helper/main.py helper/models.py helper/parsers/*.py
  extension-package:
    needs: javascript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package validated extension
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')"
          mkdir -p dist
          cd extension
          zip -qr "../dist/nims-results-connector-$version.zip" manifest.json src
      - uses: actions/upload-artifact@v4
        with:
          name: nims-results-connector
          path: dist/nims-results-connector-*.zip
          if-no-files-found: error
          retention-days: 14
