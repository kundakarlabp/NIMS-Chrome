name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enforce bulk-API-only desktop connector
        shell: bash
        run: |
          set -euo pipefail
          test ! -e helper
          test ! -e mobile
          test ! -e shared
          test ! -e tests
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.load(open('extension/manifest.json'))
          assert m['version'] == '0.6.0'
          expected = {
              'background.js',
              'bulkCaptureMain.js',
              'bulkNormalizer.js',
              'dashboardBridge.js',
              'nimsRestApi.js',
              'nimsUiBridge.js',
          }
          assert {p.name for p in Path('extension/src').iterdir() if p.is_file()} == expected
          runtime = '\n'.join(Path('extension/src', name).read_text() for name in expected)
          forbidden = [
              'NIMS_BRIDGE_RUN_SUMMARY',
              'NIMS_DISCOVER_MAPPING',
              'NIMS_HELPER_PARSE_REPORT',
              'No View Report button found for row',
              'Cr No Wise Result Report Printing New',
          ]
          assert all(token not in runtime for token in forbidden)
          PY

  javascript:
    needs: repository-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  extension-package:
    needs: javascript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package validated extension
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')"
          mkdir -p dist
          cd extension
          zip -qr "../dist/nims-results-connector-$version.zip" manifest.json src
      - uses: actions/upload-artifact@v4
        with:
          name: nims-results-connector
          path: dist/nims-results-connector-*.zip
          if-no-files-found: error
          retention-days: 14
