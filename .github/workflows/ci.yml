name: Native Android Rebuild

on:
  push:
    branches:
      - release/android-native-rebuild-v1
      - fix/android-v102-clinical-usability
      - fix/android-v103-crash-api-labs
      - fix/android-v104-clinical-trends-cultures
      - fix/android-v105-clinical-workspace
      - fix/android-v106-dashboard-api-parity
      - fix/android-v107-report-reading-persistence
      - fix/android-v108-provenance-report-fidelity
      - fix/android-v109-patient-shelf-pdf-tables
      - fix/android-v110-clinical-report-renderers
      - fix/android-v111-source-provenance-routing
      - fix/android-v112-report-completeness
      - fix/android-v113-inline-review-diagnostics
      - fix/android-v114-global-diagnostics-recent-scroll
      - fix/android-v115-integrated-results-pdf-evidence
  pull_request:
    branches:
      - release/android-native-rebuild-base
      - release/android-native-rebuild-v101

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build, unit test, lint, assemble
        run: gradle -p android-native clean test lintDebug assembleDebug --stacktrace --console=plain
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: nims-results-native-rebuild
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
