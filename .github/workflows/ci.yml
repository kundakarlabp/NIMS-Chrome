name: Android APK

on:
  push:
    branches:
      - release/android-simple-v011
  pull_request:
    branches:
      - release/android-simple-base

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build, unit test, lint, and assemble
        working-directory: mobile/android
        run: ./gradlew clean test lintDebug assembleDebug --stacktrace --console=plain
      - name: Verify APK runtime assets
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          listing="$(unzip -l "$apk")"
          for required in nimsReportCore.js contentUtils.js nimsAndroidFrameBridge.js nimsWebviewShim.js; do
            echo "$listing" | grep "assets/$required"
          done
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: nims-results-simple-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
