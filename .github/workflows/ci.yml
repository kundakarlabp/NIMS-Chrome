name: Fresh Android APK

on:
  push:
    branches:
      - release/android-fresh-v1
  pull_request:
    branches:
      - release/android-fresh-base

concurrency:
  group: fresh-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build, unit test, lint and assemble
        run: gradle -p android-fresh clean test lintDebug assembleDebug --stacktrace --console=plain
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="android-fresh/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: nims-dashboard-android-fresh
          path: android-fresh/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
