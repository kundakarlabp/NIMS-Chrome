name: CI

on:
  push:
    branches: [main, fix/results-provenance-identity-v2, fix/android-v120-staged-bulk-clinical-data]
  pull_request:
    branches: [main, fix/results-provenance-identity-v2, fix/android-v120-staged-bulk-clinical-data]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Enforce desktop Results-only repository
        shell: bash
        run: |
          set -euo pipefail
          for removed in mobile shared docs scripts railway.json .dockerignore; do
            test ! -e "$removed"
          done
          test ! -e dashboard/mobileRelay.ts
          test ! -e dashboard/APPDEPLOY_MOBILE_BRIDGE_PATCH.md
          ! find extension/src -maxdepth 1 -type f \( -name 'sidepanel*' -o -name 'manualAnalysis*' -o -name 'manualSidepanel*' \) | grep .
      - name: Verify connector manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          m = json.load(open("extension/manifest.json"))
          assert m["version"] == "0.6.10"
          for entry in m["content_scripts"]:
            if entry.get("match_origin_as_fallback"):
              assert entry.get("all_frames") is True
              assert entry["matches"] == ["https://nimsts.edu.in/*", "https://www.nimsts.edu.in/*"]
              assert all(p.endswith("/*") and p.count("/", p.index("://")+3) == 1 for p in entry["matches"])
          assert "side_panel" not in m and "action" not in m
          scripts = [p for entry in m["content_scripts"] for p in entry.get("js", [])]
          assert "src/contentScript.js" in scripts
          assert "src/contentUtils.js" in scripts
          assert "src/nimsSessionBridge.js" in scripts
          assert "src/bulkCaptureMain.js" in scripts
          assert "src/nimsUiBridge.js" in scripts
          assert not any("manual" in p.lower() or "sidepanel" in p.lower() for p in scripts)
          PY

  javascript:
    needs: repository-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  helper:
    needs: repository-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r helper/requirements-dev.txt
      - run: PYTHONPATH=helper python -m pytest -q tests/test_parsers.py tests/test_remote_helper.py
      - run: python -m py_compile helper/main.py helper/models.py helper/cache.py helper/parsers/*.py

  extension-package:
    needs: [javascript, helper]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package validated extension
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')"
          mkdir -p dist
          cd extension
          zip -qr "../dist/nims-results-connector-$version.zip" manifest.json src
      - uses: actions/upload-artifact@v4
        with:
          name: nims-results-connector
          path: dist/nims-results-connector-*.zip
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Validate captured WebView JavaScript
        run: |
          node --check android-native/app/src/main/assets/nims_engine.js
          node --test android-native/tests/nims_engine_batches.test.cjs
      - name: Restore persistent APK signer when configured
        shell: bash
        env:
          NIMS_SIGNING_KEYSTORE_B64: ${{ secrets.NIMS_SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NIMS_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NIMS_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NIMS_SIGNING_KEY_PASSWORD }}
          ORIGINAL_CERT_SHA256: ${{ secrets.NIMS_INSTALLED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          echo "NIMS_APK_ARTIFACT_NAME=nims-results-debug-NOT-upgrade-verified" >> "$GITHUB_ENV"
          if [[ -z "$NIMS_SIGNING_KEYSTORE_B64" ]]; then
            echo "::warning::Original signing keystore unavailable: debug APK CANNOT be claimed update-compatible."
            exit 0
          fi
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$ORIGINAL_CERT_SHA256" ]]; then
            echo "::error::Persistent signer must provide keystore, key credentials and original installed certificate SHA-256."
            exit 1
          fi
          printf '%s' "$NIMS_SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nims-existing-signer.jks"
          chmod 600 "$RUNNER_TEMP/nims-existing-signer.jks"
          echo "NIMS_SIGNING_STORE_FILE=$RUNNER_TEMP/nims-existing-signer.jks" >> "$GITHUB_ENV"
          echo "NIMS_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "NIMS_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "NIMS_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "NIMS_EXPECTED_INSTALLED_CERT_SHA256=$ORIGINAL_CERT_SHA256" >> "$GITHUB_ENV"
          echo "::notice::Persistent signer enabled. APK certificate verification is mandatory."
      - name: Build, unit test, lint, assemble
        run: gradle -p android-native clean test lintDebug lintRelease assembleDebug assembleRelease --stacktrace --console=plain
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          apk="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          if [[ -n "${NIMS_SIGNING_STORE_FILE:-}" ]]; then
            # Compare against the certificate of the ALREADY-INSTALLED app,
            # not against a newly generated key or filename.
            sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            signer="$(find "$sdk/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
            test -x "$signer"
            actual="$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            expected="$(printf '%s' "$NIMS_EXPECTED_INSTALLED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            if [[ -z "$actual" || "$actual" != "$expected" ]]; then
              echo "::error::Signer mismatch: this APK MUST NOT replace the installed app."
              exit 1
            fi
            echo "NIMS_APK_ARTIFACT_NAME=nims-results-existing-signer-verified" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NIMS_APK_ARTIFACT_NAME }}
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
