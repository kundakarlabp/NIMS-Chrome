name: Update fast pipeline contract test

on:
  push:
    branches:
      - fix/nims-lab-culture-parsing-0103
    paths:
      - scripts/update_fast_pipeline_contract_test.py
      - .github/workflows/update-fast-pipeline-contract-test.yml

permissions:
  contents: write

jobs:
  update-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nims-lab-culture-parsing-0103
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Update stale contract test
        run: python scripts/update_fast_pipeline_contract_test.py
      - name: Run helper tests
        run: |
          pip install -r helper/requirements-dev.txt
          python -m pytest -q
          python -m py_compile helper/main.py helper/models.py helper/cache.py
      - name: Run Android unit tests, lint, and assemble
        working-directory: mobile/android
        run: ./gradlew clean test lintDebug assembleDebug --console=plain
      - name: Commit validated correction
        run: |
          rm -rf mobile/android/.kotlin
          rm -f scripts/update_fast_pipeline_contract_test.py .github/workflows/update-fast-pipeline-contract-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Update bulk pipeline contract test"
          git push origin HEAD:fix/nims-lab-culture-parsing-0103
